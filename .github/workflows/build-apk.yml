name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: false
          packages: platform-tools

      - name: Install Android SDK 35
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Extract QuestionWise Project
        run: |
          unzip -q QuestionWise_ULTRA_PRO_Android.zip -d extracted
          PROJECT_DIR=$(find extracted -name settings.gradle.kts -printf '%h\n' | head -n 1)
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project found at: $PROJECT_DIR"

      - name: Fix Java and Kotlin JVM Target
        run: |
          python3 - "$PROJECT_DIR/app/build.gradle.kts" <<'PY'
          import sys

          path = sys.argv[1]

          with open(path, "r", encoding="utf-8") as f:
              text = f.read()

          if "compileOptions {" in text:
              if "sourceCompatibility" not in text:
                  text = text.replace(
                      "compileOptions {",
                      """compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17"""
                  )
          else:
              text = text.replace(
                  "android {",
                  """android {
                  compileOptions {
                      sourceCompatibility = JavaVersion.VERSION_17
                      targetCompatibility = JavaVersion.VERSION_17
                  }"""
              )

          if "kotlinOptions {" in text:
              if "jvmTarget" not in text:
                  text = text.replace(
                      "kotlinOptions {",
                      'kotlinOptions {\n        jvmTarget = "17"'
                  )
          else:
              text += """

          kotlinOptions {
              jvmTarget = "17"
          }
          """

          with open(path, "w", encoding="utf-8") as f:
              f.write(text)

          print("JVM target fixed to Java/Kotlin 17")
          PY

      - name: Show Gradle Configuration
        run: |
          echo "===== app/build.gradle.kts ====="
          cat "$PROJECT_DIR/app/build.gradle.kts"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Build Debug APK
        run: |
          cd "$PROJECT_DIR"
          gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: QuestionWise-ULTRA-PRO-APK
          path: '**/app/build/outputs/apk/debug/app-debug.apk'
          if-no-files-found: error
